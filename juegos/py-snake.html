<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PySnake - Neon Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&display=swap');

        :root {
            --py-blue: #3776ab;
            --py-blue-dark: #1e3d59;
            --py-yellow: #ffd43b;
            --py-yellow-dark: #b89100;
            --terminal-green: #4af626;
        }

        body {
            background-color: #050505;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(55, 118, 171, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 212, 59, 0.1) 0%, transparent 40%);
            touch-action: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        #game-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .header-title {
            font-size: 4rem; 
            font-weight: 600;
            letter-spacing: -4px;
            display: flex;
            line-height: 0.9;
        }

        .py-blue { color: var(--py-blue); text-shadow: 0 0 20px rgba(55, 118, 171, 0.5); }
        .py-yellow { color: var(--py-yellow); text-shadow: 0 0 20px rgba(255, 212, 59, 0.5); }

        #game-container {
            position: relative;
            padding: 8px;
            background: linear-gradient(145deg, #1e1e1e, #111);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        #game-canvas {
            border-radius: 12px;
            background-color: #000;
            display: block;
            width: 400px;
            height: 400px;
        }

        #overlay {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 12px;
        }

        /* --- NUEVO ESTILO DE SELECCIONADOR --- */
        .theme-card {
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 110px;
        }

        .theme-card:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-5px);
        }

        .theme-card.active {
            border-color: var(--terminal-green);
            background: rgba(74, 246, 38, 0.05);
            box-shadow: 0 0 15px rgba(74, 246, 38, 0.2);
        }

        .snake-preview {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            position: relative;
            box-shadow: 0 0 10px currentColor;
        }

        .preview-eye {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 1px;
            top: 8px;
        }

        #start-btn {
            background: #0a0a0a;
            color: var(--terminal-green);
            padding: 14px 40px;
            border: 2px solid var(--terminal-green);
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-weight: 700;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(74, 246, 38, 0.2);
            transition: all 0.2s ease;
        }

        #start-btn:hover {
            background: var(--terminal-green);
            color: black;
            box-shadow: 0 0 25px var(--terminal-green);
        }

        #status-panel {
            margin-top: 15px;   /* Espacio entre el escenario y el contador */
            width: 100%;
            max-width: 400px;    /* Cambia este valor para hacerlo más ancho o angosto */
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 17, 17, 0.9);
            padding: 5px 20px;  /* El primer número es espacio arriba/abajo, el segundo izquierda/derecha */
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-label {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .status-value {
            font-family: 'Fira Code', monospace;
            font-size: 1.6rem; 
            font-weight: 700;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div id="game-header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Python-logo-notext.svg/960px-Python-logo-notext.svg.png" alt="Logo de Python" class="w-12 h-12">
        <h1 class="header-title">
            <span class="py-blue">Py</span><span class="py-yellow">Snake</span>
        </h1>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="400" height="400"></canvas>
        
        <div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center z-10 transition-all duration-500">
            <p class="status-label mb-6 text-white text-lg">Configurar Script</p>
            
            <div class="flex gap-8 mb-10">
                <!-- Tarjeta Azul -->
                <div id="card-blue" onclick="selectTheme('blue')" class="theme-card active">
                    <div class="snake-preview" style="background: #3776ab; color: #3776ab;">
                        <div class="preview-eye" style="left: 8px;"></div>
                        <div class="preview-eye" style="right: 8px;"></div>
                    </div>
                    <span class="text-xs font-bold text-white tracking-widest">PY_BLUE</span>
                </div>

                <!-- Tarjeta Amarilla -->
                <div id="card-yellow" onclick="selectTheme('yellow')" class="theme-card">
                    <div class="snake-preview" style="background: #ffd43b; color: #ffd43b;">
                        <div class="preview-eye" style="left: 8px;"></div>
                        <div class="preview-eye" style="right: 8px;"></div>
                    </div>
                    <span class="text-xs font-bold text-white tracking-widest">PY_YELLOW</span>
                </div>
            </div>

            <button id="start-btn">EJECUTAR SCRIPT</button>
            <p id="final-score" class="mt-6 py-yellow font-bold text-2xl hidden"></p>
        </div>
    </div>

    <div id="status-panel">
        <div>
            <p class="status-label">Puntos</p>
            <p id="score-display" class="status-value text-white">0000</p>
        </div>
        <div class="text-right">
            <p class="status-label">Estado</p>
            <p id="status-text" class="status-value text-green-400">READY</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const finalScore = document.getElementById('final-score');
        const statusText = document.getElementById('status-text');

        const gridSize = 20; 
        let tileCount = 20; 
        let snake = [];
        let food = { x: 5, y: 5 };
        let dx = 0, dy = 0;
        let score = 0, gameSpeed = 100;
        let gameLoop, isRunning = false;

        let snakeColor = '#3776ab', snakeColorDark = '#1e3d59', foodColor = '#ffd43b';

        function selectTheme(color) {
            // Actualizar UI de tarjetas
            document.getElementById('card-blue').classList.remove('active');
            document.getElementById('card-yellow').classList.remove('active');
            document.getElementById(`card-${color}`).classList.add('active');

            if (color === 'blue') {
                snakeColor = '#3776ab'; snakeColorDark = '#1e3d59'; foodColor = '#ffd43b';
            } else {
                snakeColor = '#ffd43b'; snakeColorDark = '#b89100'; foodColor = '#3776ab';
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(74, 246, 38, 0.15)';
            ctx.lineWidth = 1;
            ctx.shadowBlur = 4;
            ctx.shadowColor = 'rgba(74, 246, 38, 0.3)';
            
            for(let i=0; i<=canvas.width; i+=gridSize) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
            }
            ctx.shadowBlur = 0;

            ctx.fillStyle = foodColor;
            ctx.shadowBlur = 10;
            ctx.shadowColor = foodColor;
            ctx.beginPath();
            ctx.arc(food.x*gridSize + gridSize/2, food.y*gridSize + gridSize/2, gridSize/2.5, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            snake.forEach((part, index) => {
                const isHead = index === 0;
                const x = part.x * gridSize;
                const y = part.y * gridSize;

                ctx.fillStyle = isHead ? snakeColor : snakeColorDark;
                if (isHead) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = snakeColor;
                }
                
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, gridSize - 2, gridSize - 2, 4);
                ctx.fill();
                ctx.shadowBlur = 0;

                if (isHead) {
                    ctx.fillStyle = 'white';
                    let eyeSize = 3;
                    let eyeOffset = 5;

                    if (dy === -1 || (dx === 0 && dy === 0)) { // Arriba
                        ctx.fillRect(x + eyeOffset, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + gridSize - eyeOffset - eyeSize, y + eyeOffset, eyeSize, eyeSize);
                    } else if (dy === 1) { // Abajo
                        ctx.fillRect(x + eyeOffset, y + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(x + gridSize - eyeOffset - eyeSize, y + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (dx === -1) { // Izquierda
                        ctx.fillRect(x + eyeOffset, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + eyeOffset, y + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (dx === 1) { // Derecha
                        ctx.fillRect(x + gridSize - eyeOffset - eyeSize, y + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(x + gridSize - eyeOffset - eyeSize, y + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    }
                }
            });
        }

        function move() {
            if (dx === 0 && dy === 0) return;
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || 
                snake.some((p, i) => i !== 0 && p.x === head.x && p.y === head.y)) {
                gameOver(); return;
            }
            
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.innerText = score.toString().padStart(4, '0');
                spawnFood();
                if (gameSpeed > 50) { gameSpeed -= 2; restartLoop(); }
            } else { snake.pop(); }
        }

        function spawnFood() {
            food = { x: Math.floor(Math.random()*tileCount), y: Math.floor(Math.random()*tileCount) };
            if (snake.some(p => p.x === food.x && p.y === food.y)) spawnFood();
        }

        function gameOver() {
            isRunning = false; clearInterval(gameLoop);
            overlay.style.opacity = "1"; overlay.style.pointerEvents = "auto";
            statusText.innerText = "CRASH";
            statusText.classList.replace('text-green-400', 'text-red-500');
            finalScore.innerText = `PUNTOS: ${score}`;
            finalScore.classList.remove('hidden');
            startBtn.innerText = "REINTENTAR";
        }

        function startGame() {
            const startX = Math.floor(tileCount/2);
            snake = [{x: startX, y: startX}, {x: startX, y: startX+1}, {x: startX, y: startX+2}];
            dx = 0; dy = -1; score = 0; gameSpeed = 100;
            scoreDisplay.innerText = "0000";
            statusText.innerText = "ACTIVE";
            statusText.classList.replace('text-red-500', 'text-green-400');
            finalScore.classList.add('hidden');
            spawnFood();
            isRunning = true;
            overlay.style.opacity = "0"; overlay.style.pointerEvents = "none";
            restartLoop();
        }

        function restartLoop() {
            clearInterval(gameLoop);
            gameLoop = setInterval(() => { move(); draw(); }, gameSpeed);
        }

        function handleControl(dir) {
            if (!isRunning) return;
            if (dir === 'up' && dy === 0) { dx = 0; dy = -1; }
            if (dir === 'down' && dy === 0) { dx = 0; dy = 1; }
            if (dir === 'left' && dx === 0) { dx = -1; dy = 0; }
            if (dir === 'right' && dx === 0) { dx = 1; dy = 0; }
        }

        window.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();
            if (['arrowup', 'w'].includes(key)) { e.preventDefault(); handleControl('up'); }
            else if (['arrowdown', 's'].includes(key)) { e.preventDefault(); handleControl('down'); }
            else if (['arrowleft', 'a'].includes(key)) { e.preventDefault(); handleControl('left'); }
            else if (['arrowright', 'd'].includes(key)) { e.preventDefault(); handleControl('right'); }
        });

        startBtn.addEventListener('click', startGame);
        
        function anim() {
            draw();
            requestAnimationFrame(anim);
        }
        anim();
    </script>
</body>
</html>
